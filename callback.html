<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawfect Pipeline - TikTok Authorization</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        .code-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        .button:hover {
            background: #764ba2;
        }
        .error {
            color: #d32f2f;
            margin-top: 20px;
        }
        .success {
            color: #388e3c;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐾 Pawfect Pipeline</div>
        <h1>TikTok Authorization</h1>

        <div id="loading" style="display: none;">
            <p>Processing authorization...</p>
        </div>

        <div id="success" style="display: none;">
            <p class="success">✓ Authorization successful!</p>
            <p>Authorization code:</p>
            <div class="code-box" id="auth-code"></div>
            <p>Copy this code and paste it back into Pawfect Pipeline, or it will be automatically sent to your local application.</p>
            <button class="button" onclick="window.location.href='https://tanhuynh-swe.github.io/pawfect/'">Back to Pawfect</button>
        </div>

        <div id="error" style="display: none;">
            <p class="error">✗ Authorization failed</p>
            <div class="code-box" id="error-message"></div>
            <button class="button" onclick="window.location.href='https://tanhuynh-swe.github.io/pawfect/'">Back to Pawfect</button>
        </div>
    </div>

    <script>
        // Get the authorization code and other params from URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        // Hide loading after a short delay
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 500);

        if (code) {
            // Success case
            document.getElementById('success').style.display = 'block';
            document.getElementById('auth-code').textContent = code;

            // Try to send the code to local server at localhost:8080
            fetch('http://localhost:8080/callback?code=' + encodeURIComponent(code))
                .catch(err => {
                    console.log('Local server not available, user will copy code manually');
                });
        } else if (error) {
            // Error case
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent =
                (errorDescription || error || 'Unknown error occurred');
        } else {
            // No params
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent =
                'No authorization code received. Please try again.';
        }
    </script>
</body>
</html>
