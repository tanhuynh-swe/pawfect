# Pawfect Love Animals — pipeline configuration
# Everything here is free-tier. Keys go in .env, never in this file.

channel:
  handle: "@PawfectLoveAnimals"
  name: "Pawfect Love Animals"
  # Your own angle. This is the single most important line in the file:
  # it is what keeps the channel out of YouTube's "mass-produced" bucket.
  # Rewrite it in your own words once you know what your audience likes.
  angle: >
    The ridiculous things dogs and cats do, and what is actually going on
    behind them. Every video opens on a behaviour that looks funny or baffling
    to the owner, then explains the real cause plainly, with the vet consensus
    stated straight and the common myths named and corrected. Warm and
    entertaining about the animal, never flippant about its health.
  target_language: en
  # Long-form only, per your choice.
  target_minutes: [6, 9]

# TikTok Shop affiliate links (auto-added to TikTok video descriptions)
affiliate:
  enabled: true
  disclosure: "🤝 We earn commissions from affiliate links — it doesn't cost you more."
  template: |
    📦 Products mentioned:
    [Add Chewy, Amazon, or pet brand affiliate links here]

    {disclosure}
  # Add product categories relevant to each video
  categories:
    - dog food
    - cat food
    - pet toys
    - grooming supplies
    - pet health

video:
  width: 1920
  height: 1080
  fps: 30
  # Seconds each visual stays on screen before cutting to the next.
  # Lower = more visual variety = better retention. Do not go below 3.
  max_shot_seconds: 6.5
  crossfade_seconds: 0.4
  music_volume: 0.06        # narration must dominate
  narration_lufs: -16       # YouTube's normalization target
  # Captions are drawn with Pillow and composited, so this no longer depends
  # on the ffmpeg build having libass.
  burn_captions: false

# Vertical format, used automatically by any script with "format": "vertical".
# Anything not listed here falls back to the `video` block above.
shorts:
  width: 1080
  height: 1920
  # Far shorter shots than long-form: vertical viewers leave in seconds, and
  # a static frame is the fastest way to lose them.
  max_shot_seconds: 2.8
  caption_size: 74          # readable on a phone at arm's length
  banner_size: 88
  caption_margin_v: 380     # clear of the Shorts/TikTok UI along the bottom
  side_margin: 70
  # Kept for reference: the Vietnamese font is now chosen by render.py from
  # CAPTION_FONTS_VI, since captions are drawn with Pillow rather than libass.
  font_vi: "Arial Unicode MS"
  # A Short must stay under 3 minutes to qualify. Pure hook content wants
  # under 60s, but a tutorial that has to include a safety warning runs
  # 80-110s and still holds up, so the warning band is set wider than the
  # advice you will read elsewhere.
  target_seconds: [40, 110]

voice:
  # edge   = free, nothing to download, more natural voice, needs internet
  # piper  = free, fully offline after a one-time 60MB model download
  # If the chosen engine fails, the other is tried automatically.
  engine: edge
  piper_voice: en_US-lessac-medium
  piper_speed: 0.8          # 0.8 = slower, more natural; 1.0 = normal
  # Piper models are single-language, and handed the wrong language one does
  # not fail — it reads the letters with its own phonetics and returns
  # confident gibberish. A language listed here may use the offline fallback;
  # a language not listed fails loudly instead of narrating nonsense.
  piper_voices:
    en: en_US-lessac-medium
    # vi: vi_VN-vais1000-medium   # uncomment to allow offline Vietnamese
  # The Multilingual voices are Microsoft's newer generation and sound far
  # more human than the older ones like AriaNeural — better sentence rhythm,
  # less of the flat "announcer" cadence. Run `python run.py voicetest` to
  # hear the candidates side by side and put your favourite here.
  edge_voice: en-US-AvaMultilingualNeural
  # Per-language voices. A script with "language": "vi" uses the vi entry.
  # Check them by ear first with: python run.py voicetest
  voices:
    en: en-US-AvaMultilingualNeural
    vi: vi-VN-NamMinhNeural
    # Traditional Chinese, for Taiwan and Hong Kong. Mainland China is not
    # reachable through TikTok at all, so no Simplified voice is configured.
    zh-TW: zh-TW-HsiaoChenNeural
  # A touch slower than default reads as considered rather than rushed.
  edge_rate: "-2%"
  edge_pitch: "+0Hz"
  # Pause between sentences within a scene. Clips are trimmed of the silence
  # edge-tts pads them with first, so this is the whole pause, not an addition
  # to it — raising it slows the narration's breathing noticeably.
  sentence_silence: 0.25
  # Pause left at the end of a scene so the next one does not run into it.
  scene_gap: 0.18
  # Longest pause allowed anywhere inside one synthesised clip. edge-tts
  # rests about 0.25s at every comma, and Vietnamese narration is comma-heavy,
  # so uncapped the voice stops every couple of seconds. A clip now holds
  # several sentences, so this has to stay long enough that a full stop is
  # still audible as one — below about 0.25 the sentences run together.
  max_pause: 0.32
  # Sentences are grouped into requests of at most this many characters.
  # One sentence per request restarts the voice's intonation at every full
  # stop, which is what made short beats ("Cham. Khong nhuc nhich.") read as a
  # list. Raising it makes the voice flow further but lengthens each stream,
  # and a long stream is the one the endpoint truncates.
  batch_chars: 200
  # Read only by configs written before max_pause existed.
  phrase_pause: 0.12

  # Per-language prosody, merged over everything above once the script's
  # language is known. Vietnamese needs its own settings: vi-VN has only two
  # Edge voices and both are the older generation, which read fast and even.
  # Slowing the rate and letting the pauses breathe is most of the difference
  # between "announcer" and "person". Tune these by ear with:
  #   python run.py voicetest --language vi
  # VieNeu-TTS: a Vietnamese-native model (Apache 2.0) that runs offline on
  # the CPU at roughly 0.4x real time. Edge has exactly two vi-VN voices and
  # both are its older, flatter generation; this has twenty-five across the
  # northern, central and southern accents, and clones one from a few seconds
  # of reference audio. Audition them with: python run.py voicetest --language vi
  vieneu:
    mode: v3turbo           # v3nano is faster and rougher, for a weak CPU
    voice: "Minh Quân Pro"  # any preset name; see the voicetest listing
    # Set this to a 3-8 second wav of a real voice to clone it instead, and
    # the channel gets one narrator of its own rather than a stock preset.
    # ref_audio: assets/voices/vi_reference.wav
    denoise: true
    temperature: 0.8        # lower is steadier, higher is more expressive

  tuning:
    vi:
      # Vietnamese narrates with VieNeu rather than Edge. Everything below is
      # only read if this build falls back to Edge.
      engine: vieneu
      edge_rate: "-8%"
      edge_pitch: "+0Hz"
      max_pause: 0.42         # commas allowed to land rather than be clipped
      sentence_silence: 0.34  # a full stop should be heard as one
      batch_chars: 260        # carry the line further before resetting prosody

visuals:
  # Tried in order: moving footage first, then stills, which render.py gives a
  # slow push and drift so they play as footage. A precise photograph beats a
  # video of roughly the right animal.
  #
  # coverr and pixabay need a free key and skip themselves silently without
  # one, which is why pexels sits below them rather than being removed — a
  # missing key would otherwise mean no footage at all. wikimedia needs no key
  # and keeps the pipeline working out of the box, but it is stills only and
  # its animal photographs are often wild rather than domestic, so it is last.
  providers: [coverr, pixabay, pexels, pexels_photos, wikimedia]
  orientation: landscape
  # Preferred long edge. Below this the next-best file is taken anyway, but
  # nothing under 1280 is ever accepted: upscaled to 1080p it looks like a
  # screen recording.
  min_width: 1920
  # Above this a clip is only used when there is no smaller version. 4K stock
  # is a slow download and the render immediately scales it back down.
  max_width: 2560
  # Leave this off. Pixabay's newest-first ordering all but ignores the search
  # term — asked for a cat in a box it returns kebab cooking and glaciers.
  prefer_recent: false
  # Skip Pixabay clips tagged "ai generated". Synthetic animals undercut a
  # channel about what real pets do.
  exclude_ai: true
  # Tried between the scene's own query and the bare noun, so a filler shot is
  # still an animal doing something ridiculous rather than a stock-photo pose.
  # Skipped automatically on medical and safety beats.
  tone_terms: [funny, playful]
  # Per-shot fallback if no stock clip matches the query.
  fallback_query: "funny pet"
  # The same, for a query about symptoms, pain or the vet. A last-resort shot
  # on one of those beats has to be plain.
  sober_fallback_query: "pet dog cat"

script:
  # api    = call Claude via ANTHROPIC_API_KEY (paid, but pennies per video)
  # manual = write a prompt file for you to paste into the Claude app (free)
  # Auto mode requires 'api' — a paste step cannot run unattended.
  mode: api
  model: claude-sonnet-4-6
  words_per_minute: 150

research:
  # How many topic candidates to score per run.
  candidates_per_run: 12
  # Wikipedia is used only to ground facts; never copied verbatim.
  wikipedia_lang: en

upload:
  # Used when publishing immediately (auto mode). YouTube forces this to
  # 'private' anyway until your API project passes its compliance audit.
  privacy: public
  category_id: "15"         # Pets & Animals
  made_for_kids: false
  # Set true only if a video contains realistic synthetic imagery of
  # real people/events. AI narration over stock footage does NOT need it.
  contains_synthetic_media: false
  # Publish slots, local time, used when scheduling a batch.
  schedule:
    days: [tuesday, thursday, saturday]
    hour: 17
    minute: 0
  default_tags:
    - pet care
    - dog care
    - cat care
    - pet health
    - first time pet owner

safety:
  # Applies to `run.py publish` only. `run.py auto` uses the automated gate
  # below instead, so leave this true — it protects your manual workflow
  # without affecting the unattended one.
  require_human_review: true

  # --- automated gate, used by `run.py auto` ---

  # Every auto-run video is checked by Claude for invented statistics, unsafe
  # advice, and overconfident claims before it publishes. Turning this off
  # means nothing at all reviews your videos. Don't.
  auto_review: true

  # Maximum trigram similarity against your own published scripts.
  # Above this the video is held. This is the check that maps directly onto
  # YouTube's "mass-produced or repetitive content" policy.
  max_repetition: 0.30

  # Stop publishing automatically if this many consecutive runs get held.
  # A run of holds usually means something upstream broke.
  max_consecutive_holds: 3
