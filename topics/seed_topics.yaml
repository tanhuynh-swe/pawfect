# Seed topics for Pawfect Love Animals.
# `research.py` scores these against real YouTube search demand and picks the
# best unused one. Add your own freely — one line each.
#
# Two things to keep to when you add a topic:
#
#   Open on the behaviour, not the subject. "Why do dogs roll in fox poo"
#   is a video. "Dog hygiene" is a category. The channel's whole format is a
#   thing the owner finds funny or baffling, then the real reason.
#
#   Put the distinctive words in the first five. demand_score() searches only
#   the first five words of the title, and those results are handed to the
#   script as "what people search for". "Why do cats attack the robot vacuum"
#   is scored as "why do cats attack", which comes back with results about
#   cats attacking feet — and the script then gets written around those.
#
# wiki: optional Wikipedia article title used to ground the facts. Check that
# it exists: a missing article silently produces a script with no grounding.

# --- dog comedy: the behaviour is the joke, the mechanism is the payload ---

- title: "Why do dogs hate mailmen"
  wiki: "Reinforcement"
  angle: "The postman always leaves. Barking gets rewarded every single time, which is textbook reinforcement."

- title: "Why do dogs fart so much"
  wiki: "Flatulence"
  angle: "Gulped air, the diet, and flat faces. Plus the one kind of smell that means a vet rather than a joke."

- title: "Why do dogs steal socks and pants"
  wiki: "Olfaction"
  angle: "Your scent is the entire point. And the swallowed sock that turns it into surgery."

- title: "Why do dogs love car windows"
  wiki: "Olfaction"
  angle: "A scent feed at sixty kilometres an hour, and what the eyes and ears pay for it."

- title: "Why do dogs circle before pooping"
  wiki: "Magnetoreception"
  angle: "The north-south alignment finding everyone quotes, and how thin the evidence for it really is."

- title: "Why do dogs sleep upside down"
  wiki: "Dog anatomy"
  angle: "Dumping heat and total trust. When a dog stops doing it, something usually hurts."

- title: "Why do dogs shake off when dry"
  wiki: "Dog communication"
  angle: "A reset button after stress, not water. Once you see it you cannot unsee it."

- title: "Why do dogs snore so loudly"
  wiki: "Snoring"
  angle: "Funny on a pug, and the exact point at which it stops being funny."

- title: "Why do dogs kick grass after pooping"
  wiki: "Olfaction"
  angle: "Scent glands in the paws. It is signing the work, not tidying up."

- title: "Why do dogs beg at the table"
  wiki: "Reinforcement"
  angle: "You trained this. Once, by accident, and probably years ago."

- title: "Why do dogs fight vacuum cleaners"
