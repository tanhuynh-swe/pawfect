  angle: "Rarely 'play with me'. What the toy in the mouth is actually doing."

- title: "Why do dogs hate baths but love puddles"
  wiki: "Dog behavior"
  angle: "Control and temperature. The puddle is their idea; the bath never is."

- title: "Why dogs howl at music"
  wiki: "Dog communication"
  angle: "Pitch, not pain. Why a sustained note pulls a howl out of some breeds and not others."

- title: "Why do dogs sigh so dramatically"
  wiki: "Dog communication"
  angle: "Contentment or giving up, and the body position that tells you which."

